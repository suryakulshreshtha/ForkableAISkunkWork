[pytest]
testpaths = tests
# Generated tests are standalone artefacts: they need a served target and are
# exercised by `make generate` + the CI job, not by the default suite.
addopts = -q --strict-markers --ignore=tests/generated
markers =
    e2e: requires Playwright browser binaries
    forkable: generated by ForkableAIAgent
filterwarnings =
    ignore::DeprecationWarning
